<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Activation - Hifz Progress Portal</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      padding-bottom: 0;
      display: flex;
      align-items: center;
      min-height: 100vh;
    }
  </style>
</head>
<body>
  <div class="app-container d-flex flex-column justify-content-center">
    <div class="glass-card slide-in p-4 text-center">
      <!-- Status Icon -->
      <div id="statusIconContainer" class="d-inline-flex align-items-center justify-content-center bg-warning-subtle text-warning rounded-circle p-4 mb-3" style="width: 80px; height: 80px;">
        <i id="statusIcon" class="bi bi-clock-history fs-1"></i>
      </div>

      <h2 id="statusTitle" class="fw-bold mb-3">Registration Successful!</h2>
      
      <div id="statusDescription" class="text-muted mb-4">
        <p class="mb-2">Thank you for registering your Madrasa.</p>
        <p class="small">To activate your Madrasa account, please contact us on WhatsApp and complete the subscription payment.</p>
      </div>

      <div class="glass-card bg-light border-0 p-3 mb-4 text-start">
        <div class="d-flex justify-content-between mb-2">
          <span class="text-secondary small fw-medium">WhatsApp Support:</span>
          <span class="fw-bold text-success">+9207846064</span>
        </div>
        <div class="d-flex justify-content-between">
          <span class="text-secondary small fw-medium">Madrasa Admin:</span>
          <span id="madrasaUsthad" class="fw-semibold text-truncate" style="max-width: 180px;">Loading...</span>
        </div>
      </div>

      <!-- Action Button -->
      <a id="whatsappBtn" href="https://wa.me/9207846064" target="_blank" class="btn btn-success w-100 py-3 fw-bold rounded-pill mb-3" style="background-color: #25d366; border-color: #25d366;">
        <i class="bi bi-whatsapp me-2"></i>Contact on WhatsApp
      </a>

      <button id="checkStatusBtn" class="btn btn-primary-premium w-100 mb-3 rounded-pill py-2">
        <i class="bi bi-arrow-clockwise me-1"></i>Check Activation Status
      </button>

      <button id="logoutBtn" class="btn btn-outline-secondary w-100 rounded-pill py-2">
        <i class="bi bi-box-arrow-right me-1"></i>Log Out / Switch Account
      </button>
    </div>
  </div>

  <script type="module">
    import { checkAuthState, logoutUser } from "./src/auth.js";
    import { isOfflineMode } from "./firebase-config.js";

    const statusIconContainer = document.querySelector("#statusIconContainer");
    const statusIcon = document.querySelector("#statusIcon");
    const statusTitle = document.querySelector("#statusTitle");
    const statusDescription = document.querySelector("#statusDescription");
    const madrasaUsthad = document.querySelector("#madrasaUsthad");
    const whatsappBtn = document.querySelector("#whatsappBtn");
    const logoutBtn = document.querySelector("#logoutBtn");
    const checkStatusBtn = document.querySelector("#checkStatusBtn");

    let currentMadrasa = null;

    // Check auth status and customize layout based on account status query params
    checkAuthState("madrasa_admin", (user, madrasa) => {
      currentMadrasa = madrasa;
      madrasaUsthad.textContent = madrasa.usthadName || user.email;

      // Extract status parameter from URL
      const urlParams = new URLSearchParams(window.location.search);
      const queryStatus = urlParams.get("status") || madrasa.status;

      let msgText = `Assalamu Alaikum. I just registered my Madrasa on the Hifz Progress Portal. Please verify my payment and activate the account.\n\nMadrasa Name: ${madrasa.name}\nUsthad: ${madrasa.usthadName}\nEmail: ${user.email}`;

      if (queryStatus === "suspended") {
        statusIconContainer.className = "d-inline-flex align-items-center justify-content-center bg-danger-subtle text-danger rounded-circle p-4 mb-3";
        statusIcon.className = "bi bi-exclamation-triangle fs-1";
        statusTitle.textContent = "Account Suspended";
        statusDescription.innerHTML = `<p class="mb-2">Your Madrasa account has been suspended by the administrator.</p><p class="small">Please contact us on WhatsApp to resolve this issue and restore access.</p>`;
        msgText = `Assalamu Alaikum. My Madrasa account on the Hifz Progress Portal is suspended. Please assist.\n\nMadrasa Name: ${madrasa.name}\nEmail: ${user.email}`;
      } else if (queryStatus === "expired") {
        statusIconContainer.className = "d-inline-flex align-items-center justify-content-center bg-danger-subtle text-danger rounded-circle p-4 mb-3";
        statusIcon.className = "bi bi-calendar-x fs-1";
        statusTitle.textContent = "Subscription Expired";
        statusDescription.innerHTML = `<p class="mb-2">Your yearly subscription has expired.</p><p class="small">Please contact us on WhatsApp to complete subscription renewal and unlock your dashboard.</p>`;
        msgText = `Assalamu Alaikum. My Hifz Progress Portal subscription has expired. I would like to renew.\n\nMadrasa Name: ${madrasa.name}\nEmail: ${user.email}`;
      }

      whatsappBtn.href = `https://wa.me/9207846064?text=${encodeURIComponent(msgText)}`;
    });

    // Manual status check
    checkStatusBtn.addEventListener("click", () => {
      // Offline mode instant activation helper for demoing
      if (isOfflineMode && currentMadrasa) {
        alert("Offline mode detected. Activating this account locally to proceed to the Dashboard!");
        const mockMadrasas = JSON.parse(localStorage.getItem("mock_madrasas")) || {};
        const user = JSON.parse(localStorage.getItem("mock_current_user"));
        
        if (user && mockMadrasas[user.madrasaId]) {
          mockMadrasas[user.madrasaId].status = "active";
          localStorage.setItem("mock_madrasas", JSON.stringify(mockMadrasas));
        }
      }
      window.location.href = "index.html";
    });

    logoutBtn.addEventListener("click", async () => {
      if (confirm("Are you sure you want to log out?")) {
        await logoutUser();
      }
    });
  </script>
</body>
</html>
