<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Madrasa - Hifz Progress Portal</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    <div class="glass-card slide-in p-4 mt-3">
      <div class="text-center mb-4">
        <a href="login.html" class="btn btn-sm btn-outline-secondary-premium float-start border-0 px-2 py-1"><i class="bi bi-arrow-left"></i></a>
        <div class="d-inline-flex align-items-center justify-content-center bg-success-subtle text-success rounded-circle p-3 mb-2" style="width: 56px; height: 56px;">
          <i class="bi bi-shop fs-3"></i>
        </div>
        <h2 class="fw-bold mb-1">Madrasa Signup</h2>
        <p class="text-muted small">Register your Madrasa to track student progress</p>
      </div>

      <div id="errorAlert" class="alert alert-danger d-none" role="alert"></div>

      <form id="signupForm">
        <div class="mb-3">
          <label for="madrasaName" class="form-label small fw-semibold text-secondary">Madrasa Full Name</label>
          <div class="input-group">
            <span class="input-group-text bg-transparent border-end-0 text-muted"><i class="bi bi-building"></i></span>
            <input type="text" class="form-control border-start-0 ps-0" id="madrasaName" placeholder="Darul Uloom Quran Academy" required>
          </div>
        </div>

        <div class="mb-3">
          <label for="location" class="form-label small fw-semibold text-secondary">Location / Address</label>
          <div class="input-group">
            <span class="input-group-text bg-transparent border-end-0 text-muted"><i class="bi bi-geo-alt"></i></span>
            <input type="text" class="form-control border-start-0 ps-0" id="location" placeholder="Calicut, Kerala, India" required>
          </div>
        </div>

        <div class="mb-3">
          <label for="usthadName" class="form-label small fw-semibold text-secondary">Head Usthad Name</label>
          <div class="input-group">
            <span class="input-group-text bg-transparent border-end-0 text-muted"><i class="bi bi-person"></i></span>
            <input type="text" class="form-control border-start-0 ps-0" id="usthadName" placeholder="Usthad Ahmed Al-Hafiz" required>
          </div>
        </div>

        <div class="mb-3">
          <label for="mobileNumber" class="form-label small fw-semibold text-secondary">Contact Mobile Number</label>
          <div class="input-group">
            <span class="input-group-text bg-transparent border-end-0 text-muted"><i class="bi bi-telephone"></i></span>
            <input type="tel" class="form-control border-start-0 ps-0" id="mobileNumber" placeholder="+919876543210" required>
          </div>
        </div>

        <div class="mb-3">
          <label for="emailInput" class="form-label small fw-semibold text-secondary">Admin Email Address</label>
          <div class="input-group">
            <span class="input-group-text bg-transparent border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
            <input type="email" class="form-control border-start-0 ps-0" id="emailInput" placeholder="admin@my-madrasa.com" required>
          </div>
        </div>

        <div class="mb-3">
          <label for="passwordInput" class="form-label small fw-semibold text-secondary">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-transparent border-end-0 text-muted"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control border-start-0 ps-0" id="passwordInput" placeholder="Min. 6 characters" required minlength="6">
          </div>
        </div>

        <div class="mb-4">
          <label for="confirmPasswordInput" class="form-label small fw-semibold text-secondary">Confirm Password</label>
          <div class="input-group">
            <span class="input-group-text bg-transparent border-end-0 text-muted"><i class="bi bi-lock-fill"></i></span>
            <input type="password" class="form-control border-start-0 ps-0" id="confirmPasswordInput" placeholder="Repeat password" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary-premium w-100 mb-3" id="signupButton">
          <span class="spinner-border spinner-border-sm d-none me-2" role="status" aria-hidden="true"></span>
          Register & Continue
        </button>
      </form>

      <div class="text-center">
        <p class="small text-muted mb-0">Already have an account? <a href="login.html" class="text-success fw-semibold text-decoration-none">Log in here</a></p>
      </div>
    </div>
  </div>

  <script type="module">
    import { registerMadrasa } from "./src/auth.js";

    const signupForm = document.querySelector("#signupForm");
    const signupButton = document.querySelector("#signupButton");
    const errorAlert = document.querySelector("#errorAlert");

    signupForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorAlert.classList.add("d-none");

      const madrasaName = document.querySelector("#madrasaName").value.trim();
      const location = document.querySelector("#location").value.trim();
      const usthadName = document.querySelector("#usthadName").value.trim();
      const mobile = document.querySelector("#mobileNumber").value.trim();
      const email = document.querySelector("#emailInput").value.trim();
      const password = document.querySelector("#passwordInput").value;
      const confirmPassword = document.querySelector("#confirmPasswordInput").value;

      if (password !== confirmPassword) {
        errorAlert.textContent = "Passwords do not match.";
        errorAlert.classList.remove("d-none");
        return;
      }

      signupButton.disabled = true;
      signupButton.querySelector(".spinner-border").classList.remove("d-none");

      try {
        await registerMadrasa({
          email,
          password,
          madrasaName,
          location,
          usthadName,
          mobile
        });
        
        // Successful signup, will route automatically to payment.html
        window.location.href = "payment.html";
      } catch (error) {
        console.error("Signup Error:", error);
        errorAlert.textContent = error.message || "An error occurred during registration. Please try again.";
        errorAlert.classList.remove("d-none");
        signupButton.disabled = false;
        signupButton.querySelector(".spinner-border").classList.add("d-none");
      }
    });
  </script>
</body>
</html>
