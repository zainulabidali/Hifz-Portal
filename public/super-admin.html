<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Admin Panel - Hifz Progress Portal</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      padding-bottom: 30px;
    }
    .super-container {
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      padding: 24px 16px;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="bg-white border-bottom py-3 px-4 d-flex justify-content-between align-items-center">
    <div>
      <h5 class="fw-bold mb-0 text-success"><i class="bi bi-shield-lock-fill me-2"></i>Super Admin Portal</h5>
      <span class="small text-muted">Platform Management</span>
    </div>
    <button id="logoutBtn" class="btn btn-sm btn-outline-danger px-3 py-1 rounded-pill fw-semibold">
      <i class="bi bi-box-arrow-right me-1"></i>Sign Out
    </button>
  </header>

  <main class="super-container slide-in">
    <!-- Notifications -->
    <div id="alertContainer" class="position-fixed top-0 start-50 translate-middle-x mt-3" style="z-index: 1050; width: 90%; max-width: 480px;"></div>

    <h3 class="fw-bold mb-4">Platform Overview</h3>

    <!-- Stats Matrix -->
    <div class="row g-3 mb-4">
      <div class="col-4 col-md-2">
        <div class="glass-card text-center p-3 mb-0">
          <h4 class="fw-bold text-dark mb-1" id="statTotalMadrasas">0</h4>
          <span class="text-muted small" style="font-size: 11px;">Total</span>
        </div>
      </div>
      <div class="col-4 col-md-2">
        <div class="glass-card text-center p-3 mb-0">
          <h4 class="fw-bold text-success mb-1" id="statActiveMadrasas">0</h4>
          <span class="text-muted small" style="font-size: 11px;">Active</span>
        </div>
      </div>
      <div class="col-4 col-md-2">
        <div class="glass-card text-center p-3 mb-0">
          <h4 class="fw-bold text-warning mb-1" id="statPendingMadrasas">0</h4>
          <span class="text-muted small" style="font-size: 11px;">Pending</span>
        </div>
      </div>
      <div class="col-4 col-md-2">
        <div class="glass-card text-center p-3 mb-0">
          <h4 class="fw-bold text-danger mb-1" id="statSuspendedMadrasas">0</h4>
          <span class="text-muted small" style="font-size: 11px;">Suspended</span>
        </div>
      </div>
      <div class="col-4 col-md-2">
        <div class="glass-card text-center p-3 mb-0">
          <h4 class="fw-bold text-secondary mb-1" id="statExpiredMadrasas">0</h4>
          <span class="text-muted small" style="font-size: 11px;">Expired</span>
        </div>
      </div>
      <div class="col-4 col-md-2">
        <div class="glass-card text-center p-3 mb-0">
          <h4 class="fw-bold text-primary mb-1" id="statTotalStudents">0</h4>
          <span class="text-muted small" style="font-size: 11px;">Students</span>
        </div>
      </div>
    </div>

    <!-- Filters and Searches -->
    <div class="glass-card p-3 mb-4">
      <div class="row g-2">
        <div class="col-12 col-md-8">
          <div class="input-group">
            <span class="input-group-text bg-transparent border-end-0 text-muted"><i class="bi bi-search"></i></span>
            <input type="text" id="madrasaSearch" class="form-control border-start-0 ps-0" placeholder="Search by name, location, or usthad...">
          </div>
        </div>
        <div class="col-12 col-md-4">
          <select id="statusFilter" class="form-select text-muted" style="border-radius: var(--radius-md);">
            <option value="all">All Statuses</option>
            <option value="pending">Pending</option>
            <option value="active">Active</option>
            <option value="suspended">Suspended</option>
            <option value="expired">Expired</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Madrasa List -->
    <h5 class="fw-bold mb-3">Registered Madrasas</h5>
    <div id="madrasaListContainer" class="row g-3">
      <div class="col-12 text-center py-5 text-muted">
        <div class="spinner-border text-success mb-2" role="status"></div>
        <p>Fetching platform records...</p>
      </div>
    </div>

  </main>

  <!-- Edit Expiry Date Modal -->
  <div class="modal fade" id="editExpiryModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0">
        <div class="modal-header">
          <h5 class="modal-title fw-bold text-success"><i class="bi bi-calendar-event me-2"></i>Set Subscription Expiry</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="editExpiryForm">
          <input type="hidden" id="expiryMadrasaId">
          <div class="modal-body py-4">
            <div class="mb-3">
              <label for="expiryDateInput" class="form-label small fw-semibold text-secondary">Expiry Date</label>
              <input type="date" class="form-control" id="expiryDateInput" required>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary-premium btn-sm rounded-pill px-3" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary-premium btn-sm rounded-pill px-4">Save Expiry</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Coordination script -->
  <script type="module" src="src/super.js"></script>
</body>
</html>
